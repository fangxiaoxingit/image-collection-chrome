name: Validate and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          for file in extension/background.js extension/pages/*.js extension/utils/*.js; do
            node --check "$file"
          done
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -v
      - name: Package extension and validate version tag
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            export RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          python3 scripts/package.py
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: image-collector
          path: |
            dist/image-collector*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: image-collector
          path: release
      - name: Verify package checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --verify-tag --title "Image Collector $RELEASE_TAG" --generate-notes
          fi
