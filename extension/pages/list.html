<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Collector</title>
    <link rel="stylesheet" href="./list.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-brand">
          <img src="../assets/logo.png" alt="Image Collector" class="brand-logo" />
          <span class="brand-title">Image Collector</span>
        </div>

        <div class="toolbar-actions">
          <button id="refresh" class="tool-btn btn-sky" type="button">
            <span class="btn-icon" aria-hidden="true">&#8635;</span>
            <span>刷新</span>
          </button>
          <button id="selectAll" class="tool-btn btn-teal" type="button">
            <span class="btn-icon" aria-hidden="true">&#10003;</span>
            <span>全选</span>
          </button>
          <button id="unselectAll" class="tool-btn btn-ash" type="button">
            <span class="btn-icon" aria-hidden="true">&#10005;</span>
            <span>全不选</span>
          </button>
          <button id="download" class="tool-btn btn-emerald" type="button">
            <span class="btn-icon" aria-hidden="true">&#8681;</span>
            <span>下载</span>
          </button>
          <button id="sendMail" class="tool-btn btn-orange" type="button">
            <span class="btn-icon" aria-hidden="true">&#9993;</span>
            <span>发送邮件</span>
          </button>
          <button id="clear" class="tool-btn btn-rose" type="button">
            <span class="btn-icon" aria-hidden="true">&#128465;</span>
            <span>清空</span>
          </button>
          <span id="count" class="count">已勾选 0 项</span>
          <button id="moreActions" class="tool-btn btn-indigo" type="button">
            <span class="btn-icon" aria-hidden="true">&#9881;</span>
            <span>更多功能</span>
          </button>
          <button id="usageGuide" class="tool-btn btn-violet" type="button">
            <span class="btn-icon" aria-hidden="true">&#8505;</span>
            <span>使用说明</span>
          </button>
        </div>
      </div>

      <div class="grid" id="list"></div>
      <div id="empty" class="empty">暂无已采集图片，请在网页图片上右键选择“收集图片”。</div>
    </div>

    <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title"></h2>
          <div class="modal-actions">
            <button id="modalDownload" class="modal-action-btn is-hidden" type="button">下载</button>
            <button id="modalDelete" class="modal-action-btn danger is-hidden" type="button">删除</button>
            <button id="modalClose" class="modal-close" type="button">关闭</button>
          </div>
        </div>
        <div id="modalText" class="modal-text"></div>
        <div id="modalConfig" class="modal-config is-hidden">
          <div class="config-grid">
            <label class="config-field" for="configDownloadDir">
              <span>下载目录</span>
              <input id="configDownloadDir" type="text" placeholder="留空=系统下载目录" />
            </label>
            <label class="config-field" for="configQueryParam">
              <span>URL 参数</span>
              <input id="configQueryParam" type="text" placeholder="format=jpg&name=large" />
            </label>
          </div>
          <div class="config-row">
            <button id="exportJson" class="modal-action-btn" type="button">导出 JSON</button>
            <button id="importJson" class="modal-action-btn" type="button">导入 JSON</button>
            <input id="importJsonFile" type="file" accept="application/json,.json" hidden />
          </div>
          <p class="config-tip">支持导入本插件导出的 JSON，也兼容仅图片数组格式。</p>
        </div>
        <div id="modalImageWrap" class="modal-image-wrap is-hidden">
          <button id="modalPrev" class="modal-nav prev is-hidden" type="button" aria-label="上一张">‹</button>
          <img id="modalImage" class="modal-image" alt="预览图片" />
          <button id="modalNext" class="modal-nav next is-hidden" type="button" aria-label="下一张">›</button>
        </div>
      </div>
    </div>

    <script type="module" src="./list.js"></script>
  </body>
</html>
