<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="listPageTitle">收集列表 - Image Collector</title>
    <link rel="stylesheet" href="./list.css" />
  </head>
  <body>
    <div id="app">
      <div class="toolbar">
        <div class="toolbar-brand">
          <img src="../assets/logo.png" alt="Image Collector" data-i18n-alt="extensionName" class="brand-logo" />
          <span class="brand-title" data-i18n="extensionName">Image Collector</span>
          <span id="totalCount" class="total-count">(共 0 张)</span>
        </div>

        <div class="toolbar-actions">
          <button id="refresh" class="tool-btn btn-sky" type="button">
            <span data-i18n="refresh">刷新</span>
          </button>
          <label class="date-sort-control" for="dateGrouping">
            <span data-i18n="dateGrouping">日期排序</span>
            <select id="dateGrouping" name="dateGrouping" title="按添加日期分组，最新在前" data-i18n-title="dateGroupingHint">
              <option value="day" data-i18n="groupByDay">按日分组</option>
              <option value="week" data-i18n="groupByWeek">按周分组</option>
              <option value="month" data-i18n="groupByMonth">按月分组</option>
            </select>
          </label>
          <button id="selectAll" class="tool-btn btn-teal" type="button">
            <span data-i18n="selectAll">全选</span>
          </button>
          <button id="unselectAll" class="tool-btn btn-ash" type="button">
            <span data-i18n="unselectAll">全不选</span>
          </button>
          <button id="download" class="tool-btn btn-emerald" type="button">
            <span data-i18n="download">下载</span>
          </button>
          <button id="batchDelete" class="tool-btn btn-crimson" type="button">
            <span data-i18n="batchDelete">批量删除</span>
          </button>
          <button id="sendMail" class="tool-btn btn-orange" type="button">
            <span data-i18n="sendMail">发送邮件</span>
          </button>
          <button id="clear" class="tool-btn btn-rose" type="button">
            <span data-i18n="clearAll">清空</span>
          </button>
          <span id="count" class="count">已勾选 0 项</span>
          <button id="openParse" class="tool-btn btn-violet" type="button">
            <span data-i18n="parsePage">解析页面</span>
          </button>
          <button id="openSettings" class="tool-btn btn-indigo" type="button">
            <span data-i18n="settings">设置</span>
          </button>
        </div>
      </div>

      <div class="date-groups" id="list"></div>
      <div id="empty" class="empty" data-i18n="collectionEmpty">暂无已采集图片，请在网页图片上右键选择“收集图片”。</div>
    </div>

    <div id="modalOverlay" class="modal-overlay" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h2 id="modalTitle" class="modal-title"></h2>
          <div class="modal-actions">
            <button id="modalDownload" class="modal-action-btn is-hidden" type="button" data-i18n="download">下载</button>
            <button id="modalDelete" class="modal-action-btn danger is-hidden" type="button" data-i18n="delete">删除</button>
            <button id="modalClose" class="modal-close" type="button" data-i18n="close">关闭</button>
          </div>
        </div>
        <div id="modalImageWrap" class="modal-image-wrap is-hidden">
          <button id="modalPrev" class="modal-nav prev is-hidden" type="button" aria-label="上一张" data-i18n-aria-label="previousImage">‹</button>
          <img id="modalImage" class="modal-image" alt="预览图片" data-i18n-alt="previewImageAlt" />
          <button id="modalNext" class="modal-nav next is-hidden" type="button" aria-label="下一张" data-i18n-aria-label="nextImage">›</button>
        </div>
      </div>
    </div>

    <script type="module" src="./list.js"></script>
  </body>
</html>
