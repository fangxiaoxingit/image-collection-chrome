<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>解析页面 - Image Collector</title>
    <link rel="stylesheet" href="./parse.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="brand">
          <img src="../assets/logo.png" alt="Image Collector" class="logo" />
          <div>
            <h1>解析页面</h1>
            <p id="sourceUrl" class="source"></p>
          </div>
        </div>

        <form id="parseForm" class="parse-form">
          <input
            id="parseUrlInput"
            type="text"
            placeholder="输入或粘贴网址，例如 https://example.com"
            autocomplete="off"
          />
          <button id="parseByUrl" type="submit">解析网址</button>
        </form>

        <div class="actions">
          <button id="selectAll" type="button">全选</button>
          <button id="unselectAll" type="button">全不选</button>
          <button id="addSelected" type="button">添加已选</button>
          <button id="reload" type="button">刷新候选</button>
          <button id="openList" type="button">打开收集列表</button>
          <span id="count" class="count">已勾选 0 项</span>
        </div>
      </header>

      <main>
        <div id="empty" class="empty">暂无解析结果。请点击插件图标后选择“解析页面”。</div>
        <div id="grid" class="grid"></div>
      </main>
    </div>

    <div id="previewOverlay" class="preview-overlay" hidden>
      <div class="preview-panel" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <div class="preview-header">
          <h2 id="previewTitle" class="preview-title"></h2>
          <button id="previewClose" type="button">关闭</button>
        </div>
        <div class="preview-wrap">
          <button id="previewPrev" class="preview-nav prev" type="button" aria-label="上一张">‹</button>
          <img id="previewImage" class="preview-image" alt="预览图片" />
          <button id="previewNext" class="preview-nav next" type="button" aria-label="下一张">›</button>
        </div>
      </div>
    </div>

    <script type="module" src="./parse.js"></script>
  </body>
</html>
